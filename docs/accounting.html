<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; img-src 'self' data: https://*.googleusercontent.com; font-src 'self'; style-src 'self' 'unsafe-inline' https://accounts.google.com; script-src 'self' 'unsafe-inline' https://accounts.google.com https://www.gstatic.com; connect-src 'self' https://sheets.googleapis.com https://www.googleapis.com https://oauth2.googleapis.com https://accounts.google.com; frame-src https://accounts.google.com" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Accounting — Investor Portal</title>
  <link rel="stylesheet" href="./css/style.css?v=20260628" />
  <style>
    /* Inline table styles — same shape as docs/data.html. The accounting
       page needs the same horizontal-scroll wrapper for the HB table. */
    .data-table-wrap {
      width: 100%; overflow-x: auto;
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--panel); box-shadow: var(--shadow);
    }
    .data-table {
      font-size: 0.85rem; width: max-content; min-width: 100%;
      border: 0; border-radius: 0; box-shadow: none;
    }
    .data-table th, .data-table td { padding: 8px 12px; white-space: nowrap; }
    .data-table th.sortable { cursor: pointer; user-select: none; }
    .data-table th.sortable:hover { color: var(--text); }
    .data-table th .sort-arrow {
      display: inline-block; width: 10px; margin-left: 4px;
      color: var(--muted); font-size: 0.72rem;
    }
    .data-table th.sorted .sort-arrow { color: var(--accent); }
    .data-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .data-table th.num { text-align: right; }
    .data-table tr:hover td { background: rgba(106, 209, 255, 0.04); }
    /* Variant: table that fills the container instead of horizontal-scrolling.
       Used by Hovedbok so the long Navn + Kommentar columns wrap. */
    .data-table.fit { width: 100%; min-width: 0; table-layout: auto; }
    .data-table.fit td.wrap, .data-table.fit th.wrap {
      white-space: normal; word-break: break-word;
    }
    .btn.small { padding: 4px 10px; font-size: 0.78rem; }
  </style>
</head>
<body>
  <div id="nav-mount"></div>
  <div class="container">
    <div class="hero">
      <h2>Accounting — Geysir Invest AS</h2>
      <div class="when" id="meta-line"></div>
    </div>
    <div id="year-picker-mount" style="margin-bottom:14px"></div>
    <div id="root">Loading…</div>
  </div>

  <!-- Google Identity Services. Intentionally no Subresource Integrity (SRI)
       hash: Google ships gsi/client as a rolling library and updates it
       without notice, so a pinned integrity hash would eventually break
       sign-in. Third-party script integrity is instead enforced by the
       Content-Security-Policy above, which restricts script origins to
       this site + Google. -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="./js/config.js?v=20260628"></script>
  <script src="./js/format.js?v=20260628"></script>
  <script src="./js/auth.js?v=20260628"></script>
  <script src="./js/sheet.js?v=20260628"></script>
  <script src="./js/parsers.js?v=20260628"></script>
  <script src="./js/store.js?v=20260628"></script>
  <script src="./js/nav.js?v=20260628"></script>
  <script src="./js/accounting.js?v=20260628"></script>
  <script src="./js/pages/accounting.js?v=20260628"></script>
</body>
</html>
