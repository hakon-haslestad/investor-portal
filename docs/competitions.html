<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Comps — Investor Portal</title>
  <link rel="stylesheet" href="./css/style.css?v=20260619" />
  <style>
    .team-row {
      display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
      padding: 8px 10px; margin-bottom: 6px;
      background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px;
    }
    .team-row .team-label { flex: 1; min-width: 160px; max-width: 240px; }
    .team-row .team-amount { width: 130px; }
    .team-row .member-chips { display: inline-flex; gap: 4px; flex-wrap: wrap; }
    .team-row .m-chip {
      display: inline-flex; align-items: center; padding: 4px 9px; border-radius: 999px;
      background: var(--bg); border: 1px solid var(--border); color: var(--muted);
      font-size: 0.82rem; font-weight: 500; cursor: pointer; user-select: none;
      text-transform: none; letter-spacing: 0; transition: all 0.12s;
    }
    .team-row .m-chip input { display: none; }
    .team-row .m-chip:hover { border-color: var(--accent); color: var(--text); }
    .team-row .m-chip.checked { background: var(--accent); color: #051a0a; border-color: var(--accent); }
    .overspent { color: var(--negative); font-weight: 600; }
  </style>
</head>
<body>
  <div id="nav-mount"></div>
  <div class="container" id="root">Loading…</div>

  <script src="./js/nav.js?v=20260619"></script>
  <script src="./js/ledger.js?v=20260619"></script>
  <script src="./js/portfolio.js?v=20260619"></script>
  <script src="./js/competitions-engine.js?v=20260619"></script>
  <script src="./js/competitions-data.js?v=20260619"></script>
  <script src="./js/pages/competitions-page.js?v=20260619"></script>
</body>
</html>
