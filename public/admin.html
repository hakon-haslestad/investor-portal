<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — Geysir Invest</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .sheet-card {
      background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 18px 20px; margin-bottom: 18px; box-shadow: var(--shadow);
    }
    .sheet-card h3 { margin: 0 0 8px; font-size: 1.05rem; }
    .sheet-card .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
    .sheet-card input[type="text"] { flex: 1; min-width: 280px; }
    .sheet-card .setup-line { color: var(--muted); font-size: 0.88rem; line-height: 1.5; }
    .sheet-card .sa-email { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--panel-2); padding: 2px 8px; border-radius: 6px; }
    .sheet-card details { margin-top: 4px; }
    .sheet-card details summary { color: var(--link); cursor: pointer; font-size: 0.88rem; }
    .sheet-card details ol { padding-left: 20px; color: var(--muted); font-size: 0.88rem; line-height: 1.7; }
    .admin-table { font-size: 0.9rem; }
    .admin-table input { padding: 6px 8px; font-size: 0.9rem; background: var(--bg); }
    .admin-table td { padding: 8px 10px; vertical-align: middle; }
    .admin-table .unmapped { background: rgba(255, 91, 91, 0.07); }
    .admin-table .saving td { opacity: 0.5; }
    .badge-unmapped {
      background: var(--danger); color: white; padding: 2px 8px;
      border-radius: 999px; font-size: 0.7rem; font-weight: 600;
    }
    .badge-mapped {
      background: rgba(62, 224, 127, 0.15); color: var(--positive);
      padding: 2px 8px; border-radius: 999px; font-size: 0.7rem; font-weight: 600;
    }
    .investor-chips { display: flex; gap: 4px; flex-wrap: wrap; }
    .investor-chip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 9px; border-radius: 999px;
      background: var(--panel-2); border: 1px solid var(--border);
      color: var(--muted); font-size: 0.82rem; font-weight: 500;
      cursor: pointer; user-select: none; transition: all 0.12s;
    }
    .investor-chip input { display: none; }
    .investor-chip:hover { border-color: var(--accent); color: var(--text); }
    .investor-chip.checked {
      background: var(--accent); color: #051a0a; border-color: var(--accent);
    }
    .admin-toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; }
    .admin-toolbar input[type="search"] { max-width: 260px; }
    .admin-toolbar button:disabled { opacity: 0.4; cursor: not-allowed; }
    .admin-table tr.dirty { background: rgba(255, 201, 79, 0.06); }
    .admin-table tr.dirty td:nth-child(2) { border-left: 3px solid var(--accent-2); padding-left: 7px; }
  </style>
</head>
<body>
  <div id="nav-mount"></div>
  <div class="container">
    <div class="hero">
      <h2>Admin — investor attribution</h2>
      <div class="when" id="meta-line"></div>
    </div>
    <div id="sheet-card"></div>

    <p class="text-muted text-small" style="max-width: 720px">
      This is the dim-values control panel. Each security from the Nordnet transactions gets mapped to one or more investors.
      Use the Member field with the same syntax as the Excel sheet: <code>HH</code>, <code>HS/ØS</code>, <code>HH/HF/HS</code>, etc.
      Leave Investment factor blank to auto-split evenly.
    </p>
    <div class="admin-toolbar">
      <input type="search" id="filter" placeholder="Filter by name / investor…" />
      <label class="text-small text-muted" style="text-transform:none">
        <input type="checkbox" id="only-unmapped" style="width:auto;margin-right:6px" /> only unmapped
      </label>
      <span style="flex:1"></span>
      <button class="btn" id="save-all" disabled>Save changes</button>
      <button class="btn ghost" id="discard-all" disabled>Discard</button>
    </div>
    <div id="root">Loading…</div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
