<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Geysir Invest — log in</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="login-shell">
    <form class="login-card" id="login-form">
      <h1>Geysir Invest AS</h1>
      <div class="sub">Time to check the bag, bro.</div>
      <label>Email</label>
      <input type="email" name="email" autocomplete="email" required />
      <label>Password</label>
      <input type="password" name="password" autocomplete="current-password" required />
      <button type="submit" class="btn">Let me in</button>
      <div class="err" id="err" style="display:none"></div>
    </form>
  </div>
  <script>
    const form = document.getElementById('login-form');
    const err = document.getElementById('err');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.style.display = 'none';
      const fd = new FormData(form);
      const r = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: fd.get('email'), password: fd.get('password') }),
      });
      if (r.ok) {
        location.href = '/index.html';
      } else {
        const body = await r.json().catch(() => ({}));
        err.textContent = body.error === 'bad_credentials' ? 'Nope. Wrong combo.' : 'Login failed.';
        err.style.display = 'block';
      }
    });
  </script>
</body>
</html>
